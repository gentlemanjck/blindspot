# Netlify build (SPEC §10). Every push to the connected repo runs the checks, then builds.
[build]
  command = "npm run check && npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "24"

# Hashed assets never change, so browsers may keep them; index.html is always revalidated.
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
